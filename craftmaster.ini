[General]
Branch = master
CraftRevision = d9d06ff743183104bc50698e376807976fa0e460
ShallowClone = False

[Variables]
UseCache = False
CreateCache = False

[GeneralSettings]
Compile/BuildType = RelWithDebInfo
Compile/UseNinja = True
ShortPath/Enabled = False
ShortPath/EnableJunctions = False
ContinuousIntegration/Enabled = True

Packager/UseCache = ${Variables:UseCache}
Packager/CreateCache = ${Variables:CreateCache}
Packager/CacheDir = ${Variables:Root}\cache

[BlueprintSettings]
nextcloud-client.buildTests = False
binary/mysql.useMariaDB = False
libs/qt6.version = 6.10.2
craft/craft-blueprints-kde.revision = master
libs/zlib.version = 1.3.1

# ── x64 (offiziell, unverändert) ─────────────────────────────────────────────
[windows-msvc2022_64-cl]
Packager/PackageType = NullsoftInstallerPackager
Packager/RepositoryUrl = https://download.nextcloud.com/desktop/development/craftCache/
Packager/CacheVersion = master-qt-6.10.2
Variables/UseCache = True
QtSDK/Compiler = msvc2022_64
General/ABI = windows-msvc2022_64-cl
Paths/Python = C:\Python312-x64

# ── ARM64 (Community Build) ───────────────────────────────────────────────────
# Kein offizieller Binärcache für ARM64 verfügbar → alles from source.
[windows-msvc2022_arm64-cl]
Packager/PackageType = NullsoftInstallerPackager
Variables/UseCache = False
Variables/CreateCache = False
QtSDK/Compiler = msvc2022_arm64
General/ABI = windows-msvc2022_arm64-cl

[Env]
CRAFT_CODESIGN_CERTIFICATE =
SIGN_PACKAGE = False
