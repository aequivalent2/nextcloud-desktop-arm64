name: Build Nextcloud ARM64

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-11-arm

    env:
      CRAFT_TARGET: windows-msvc2022_arm64-cl
      CRAFT_MASTER_LOCATION: ${{ github.workspace }}\CraftMaster
      CRAFT_MASTER_CONFIG: ${{ github.workspace }}\craftmaster.ini

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get latest Nextcloud version
        id: nc-version
        shell: pwsh
        run: |
          $release = Invoke-RestMethod "https://api.github.com/repos/nextcloud/desktop/releases/latest" `
            -Headers @{ "User-Agent" = "nextcloud-arm64-builder" }
          $version = $release.tag_name
          Write-Host "Neuester Release: $version"
          echo "VERSION=$version" >> $env:GITHUB_ENV
          echo "version=$version" >> $env:GITHUB_OUTPUT

      # ── MSVC ARM64 Compiler ────────────────────────────────────────────────
      - name: Setup MSVC ARM64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: arm64

      # ── Python (Craft läuft auf Python) ───────────────────────────────────
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ── Craft-Root-Cache (alle deps + NC-Binary, keyed by NC-Version) ──────
      # Cache-Hit → nur noch packaging, kein Build
      - name: Cache Craft root
        id: cache-craft
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\${{ env.CRAFT_TARGET }}
          key: craft-arm64-${{ steps.nc-version.outputs.version }}-v1

      # ── CraftMaster klonen (immer, nur ~5 s) ──────────────────────────────
      - name: Clone CraftMaster
        shell: pwsh
        run: |
          git clone -q --depth=1 `
            https://invent.kde.org/packaging/craftmaster.git `
            "${{ env.CRAFT_MASTER_LOCATION }}"

      # ── Craft-Hilfsfunktion als Skript ablegen ─────────────────────────────
      - name: Write craft helper
        shell: pwsh
        run: |
          $script = @'
          param([Parameter(ValueFromRemainingArguments)]$args)
          python "$env:CRAFT_MASTER_LOCATION\CraftMaster.py" `
            --config "$env:CRAFT_MASTER_CONFIG" `
            --target $env:CRAFT_TARGET `
            -c @args
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          '@
          Set-Content "${{ github.workspace }}\craft.ps1" $script -Encoding UTF8

      # ── Craft initialisieren: ersten Aufruf nutzen um Craft zu klonen ────────
      # Schlägt mit ARM64-Fehler fehl, aber Craft wird dabei geklont → danach patchbar
      - name: Craft – initialize (clone craft)
        if: steps.cache-craft.outputs.cache-hit != 'true'
        shell: pwsh
        continue-on-error: true
        run: |
          & "${{ github.workspace }}\craft.ps1" craft

      # ── CraftSetupHelper.py für ARM64 patchen ─────────────────────────────
      # Craft kennt Architecture.arm64 nicht in seiner MSVC-Architektur-Map
      - name: Patch Craft for ARM64 Windows
        if: steps.cache-craft.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $helperPath = "${{ github.workspace }}\${{ env.CRAFT_TARGET }}\craft\bin\CraftSetupHelper.py"
          if (-not (Test-Path $helperPath)) {
            throw "CraftSetupHelper.py nicht gefunden – Craft wurde nicht korrekt geklont"
          }
          $content = Get-Content $helperPath -Raw -Encoding UTF8
          if ($content -match 'Architecture\.arm64') {
            Write-Host "ARM64 bereits vorhanden, kein Patch nötig"
          } else {
            # ARM64 zur MSVC-Architektur-Map hinzufügen
            $content = $content -replace '(Architecture\.x64\s*:\s*"amd64")', '$1, Architecture.arm64: "arm64"'
            Set-Content $helperPath $content -Encoding UTF8
            Write-Host "ARM64 patch erfolgreich angewendet auf: $helperPath"
            # Patch verifizieren
            Select-String -Path $helperPath -Pattern 'arm64'
          }

      # ── Inkscape NACH Craft-Init (vermeidet Python-PATH-Konflikt) ──────────
      - name: Install Inkscape
        if: steps.cache-craft.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          choco install inkscape -y --no-progress
          # Inkscape-Python aus PATH entfernen damit GitHub-Actions-Python Vorrang hat
          $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -notlike '*Inkscape*' }) -join ';'
          $inkPath = Get-ChildItem "C:\Program Files\Inkscape*" -Directory -ErrorAction SilentlyContinue |
            Select-Object -First 1 -ExpandProperty FullName
          if ($inkPath) {
            # Nur Inkscape-bin ohne Python in PATH eintragen
            "$inkPath\bin" | Add-Content $env:GITHUB_PATH
            Write-Host "Inkscape: $inkPath"
          }

      # ── Craft – Blueprints + Dependencies installieren ─────────────────────
      - name: Craft – setup and install dependencies
        if: steps.cache-craft.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          & "${{ github.workspace }}\craft.ps1" `
            --add-blueprint-repository "https://github.com/nextcloud/craft-blueprints-kde.git|master|"
          & "${{ github.workspace }}\craft.ps1" `
            --add-blueprint-repository "https://github.com/nextcloud/desktop-client-blueprints.git|master|"
          & "${{ github.workspace }}\craft.ps1" craft
          & "${{ github.workspace }}\craft.ps1" --install-deps nextcloud-client

      # ── Nextcloud-Quellcode klonen (spezifische Version) ───────────────────
      - name: Clone Nextcloud source
        if: steps.cache-craft.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $version = $env:VERSION
          Write-Host "Klone Nextcloud $version"
          git clone https://github.com/nextcloud/desktop.git `
            --branch $version --depth 1 C:\build\nextcloud-src
          Set-Location C:\build\nextcloud-src
          git submodule update --init --recursive

      # ── ARM64-Patches anwenden ─────────────────────────────────────────────
      - name: Apply ARM64 patches
        if: steps.cache-craft.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          Set-Location C:\build\nextcloud-src
          $patchDir = "${{ github.workspace }}\patches"

          if (Test-Path "$patchDir\001-cmake-optional-type.patch") {
            git apply "$patchDir\001-cmake-optional-type.patch"
            Write-Host "Patch 001 angewendet"
          }

          # libp11-Header kopieren falls vorhanden
          if (Test-Path "$patchDir\libp11-headers") {
            Copy-Item "$patchDir\libp11-headers\*" src\libsync\ -Force
            Write-Host "libp11-Header kopiert"
          }

      # ── Build via Craft ────────────────────────────────────────────────────
      - name: Craft – build nextcloud-client
        if: steps.cache-craft.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          & "${{ github.workspace }}\craft.ps1" `
            --src-dir C:\build\nextcloud-src nextcloud-client

      # ── Packaging via Craft (erzeugt NSIS-Installer) ──────────────────────
      - name: Craft – package
        shell: pwsh
        run: |
          & "${{ github.workspace }}\craft.ps1" --package nextcloud-client

          # Installer in Workspace kopieren
          $version = $env:VERSION
          $craftRoot = "${{ github.workspace }}\${{ env.CRAFT_TARGET }}"
          $installer = Get-ChildItem "$craftRoot\packages" -Filter "*.exe" -Recurse -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $installer) {
            throw "Kein Installer gefunden in $craftRoot\packages"
          }
          $dest = "${{ github.workspace }}\Nextcloud-${version}-arm64-Setup.exe"
          Copy-Item $installer.FullName $dest -Force
          $mb = [math]::Round((Get-Item $dest).Length / 1MB, 1)
          Write-Host "Installer: $dest ($mb MB)"

      # ── Release veröffentlichen ────────────────────────────────────────────
      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ env.VERSION }}-arm64
          name: Nextcloud ${{ env.VERSION }} ARM64 (Community Build)
          body: >-
            Nextcloud Desktop ARM64 - Inoffizieller Community-Build fuer Windows on ARM
            (Surface Pro X, Snapdragon X Elite, etc.).

            Gebaut mit KDE Craft – identisches Build-System wie der offizielle Nextcloud-Client,
            kompiliert nativ fuer ARM64.

            Systemvoraussetzungen: Windows 11 ARM64 oder Windows 10 ARM64 ab Version 1903.

            HINWEIS: Dies ist kein offizielles Nextcloud-Produkt und nicht von Nextcloud GmbH signiert.
            Offizielle Builds: https://nextcloud.com/install/
          files: |
            Nextcloud-*-arm64-Setup.exe
