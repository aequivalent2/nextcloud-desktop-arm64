name: Build Nextcloud ARM64

on:
  workflow_dispatch:
    inputs:
      nextcloud_version:
        description: 'Nextcloud Version (z.B. v3.14.0)'
        required: true
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-11-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Visual Studio ARM64
        uses: microsoft/setup-msbuild@v2

      - name: Install Strawberry Perl
        run: winget install StrawberryPerl.StrawberryPerl --silent --accept-package-agreements --accept-source-agreements

      - name: Install Qt ARM64
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.1'
          arch: 'win64_msvc2022_arm64'
          modules: 'qt5compat qtwebengine qtpositioning qtwebsockets'

      - name: Install tools
        run: |
          winget install Kitware.CMake --silent --accept-package-agreements --accept-source-agreements
          winget install Ninja-build.Ninja --silent --accept-package-agreements --accept-source-agreements
          winget install Chocolatey.Chocolatey --silent --accept-package-agreements --accept-source-agreements
          choco install pkgconfiglite -y

      - name: Cache OpenSSL
        id: cache-openssl
        uses: actions/cache@v4
        with:
          path: C:\build\openssl-arm64
          key: openssl-3.3-arm64-v2

      - name: Build OpenSSL
        if: steps.cache-openssl.outputs.cache-hit != 'true'
        shell: pwsh
        run: .\scripts\build-openssl.ps1

      - name: Cache libp11
        id: cache-libp11
        uses: actions/cache@v4
        with:
          path: C:\build\libp11-arm64
          key: libp11-0.4.12-arm64-v2

      - name: Build libp11
        if: steps.cache-libp11.outputs.cache-hit != 'true'
        shell: pwsh
        run: .\scripts\build-libp11.ps1

      - name: Cache Dependencies
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: C:\build\deps-arm64
          key: deps-arm64-v2

      - name: Build Dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        shell: pwsh
        run: .\scripts\build-deps.ps1

      - name: Clone Nextcloud
        shell: pwsh
        run: |
          $version = "${{ github.event.inputs.nextcloud_version }}"
          git clone https://github.com/nextcloud/desktop.git `
            --branch $version --depth 1 C:\build\nextcloud-src
          cd C:\build\nextcloud-src
          git submodule update --init --recursive
          git clone https://github.com/KDAB/KDSingleApplication.git `
            C:\build\nextcloud-src\src\3rdparty\kdsingleapplication

      - name: Apply Patches
        shell: pwsh
        run: |
          cd C:\build\nextcloud-src
          git apply $env:GITHUB_WORKSPACE\patches\001-cmake-optional-type.patch
          Copy-Item $env:GITHUB_WORKSPACE\patches\libp11-headers\* src\libsync\

      - name: Configure
        shell: pwsh
        run: |
          $env:PATH = "C:\Qt\6.11.1\msvc2022_arm64\bin;" + $env:PATH
          $env:PKG_CONFIG_PATH = "C:\build\libp11-arm64"
          mkdir C:\build\nextcloud-build
          & "C:\Qt\6.11.1\msvc2022_arm64\bin\qt-cmake.bat" `
            C:\build\nextcloud-src `
            -B C:\build\nextcloud-build `
            -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_INSTALL_PREFIX=C:\build\nextcloud-arm64 `
            -DOPENSSL_ROOT_DIR=C:\build\openssl-arm64 `
            "-DECM_DIR=C:\build\deps-arm64\ecm\share\ECM\cmake" `
            "-DQt6Keychain_DIR=C:\build\deps-arm64\qtkeychain\lib\cmake\Qt6Keychain" `
            "-DKF6Archive_DIR=C:\build\deps-arm64\kf6archive\lib\cmake\KF6Archive" `
            "-DKDSingleApplication-qt6_DIR=C:\build\deps-arm64\kdsingleapp\lib\cmake\KDSingleApplication-qt6" `
            "-DCMAKE_TOOLCHAIN_FILE=C:\build\vcpkg\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=arm64-windows `
            "-DSQLite3_INCLUDE_DIR=C:\build\vcpkg\installed\arm64-windows\include" `
            "-DSQLite3_LIBRARY=C:\build\vcpkg\installed\arm64-windows\lib\sqlite3.lib" `
            "-DQt6WebEngineCore_DIR=C:\Qt\6.11.1\msvc2022_arm64\lib\cmake\Qt6WebEngineCore" `
            "-DQt6WebEngineWidgets_DIR=C:\Qt\6.11.1\msvc2022_arm64\lib\cmake\Qt6WebEngineWidgets"

      - name: Build
        run: cmake --build C:\build\nextcloud-build --parallel

      - name: Install & Deploy
        shell: pwsh
        run: |
          cmake --install C:\build\nextcloud-build
          Copy-Item C:\dev\qtkeychain-arm64\bin\qt6keychain.dll C:\Qt\6.11.1\msvc2022_arm64\bin\
          & "C:\Qt\6.11.1\msvc2022_arm64\bin\windeployqt.exe" C:\build\nextcloud-arm64\bin\nextcloud.exe
          Copy-Item C:\build\libp11-arm64\libp11.dll C:\build\nextcloud-arm64\bin\
          Copy-Item C:\build\vcpkg\installed\arm64-windows\bin\*.dll C:\build\nextcloud-arm64\bin\

      - name: Create ZIP
        shell: pwsh
        run: |
          $version = "${{ github.event.inputs.nextcloud_version }}"
          Compress-Archive -Path C:\build\nextcloud-arm64\* `
            -DestinationPath "Nextcloud-${version}-arm64-portable.zip"

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.nextcloud_version }}-arm64
          name: "Nextcloud ${{ github.event.inputs.nextcloud_version }} ARM64 (inoffiziell)"
          body: |
            ## Nextcloud Desktop ARM64 – Inoffizieller Build

            Nativer ARM64-Build für Windows ARM64 Geräte (Surface Pro X/11, Snapdragon X Laptops).

            ### Installation
            1. ZIP herunterladen und entpacken
            2. `nextcloud.exe` starten

            ### Getestet auf
            - Windows 11 ARM64

            ### Hinweis
            Dies ist kein offizielles Nextcloud-Produkt.
            Quellcode: https://github.com/nextcloud/desktop (GPL-2.0)
          files: "*.zip"
