name: Build Nextcloud Talk ARM64

on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-11-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get latest Talk version
        id: talk-version
        shell: pwsh
        run: |
          $release = Invoke-RestMethod "https://api.github.com/repos/nextcloud-releases/talk-desktop/releases/latest" `
            -Headers @{ "User-Agent" = "nextcloud-arm64-builder" }
          $version = $release.tag_name
          Write-Host "Neuester Release: $version"
          echo "VERSION=$version" >> $env:GITHUB_ENV
          echo "version=$version" >> $env:GITHUB_OUTPUT
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Clone Talk Desktop source
        shell: pwsh
        run: |
          # main klonen wegen ARM64-Build-Scripts (ab PR #1725, nach v2.1.2 gemerged)
          git clone --depth 1 https://github.com/nextcloud/talk-desktop.git C:\build\talk-desktop
          Write-Host "Talk Desktop main geklont (enthält ARM64-Build-Scripts)"
      - name: Clone Talk (spreed) source
        shell: pwsh
        run: |
          $pkg = Get-Content "C:\build\talk-desktop\package.json" | ConvertFrom-Json
          $spreedVersion = $pkg.talk.stable
          Write-Host "Spreed Version: $spreedVersion"
          git clone --depth 1 --branch $spreedVersion https://github.com/nextcloud/spreed.git C:\build\talk-desktop\spreed 2>&1
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "Branch $spreedVersion nicht gefunden, verwende main"
            git clone --depth 1 https://github.com/nextcloud/spreed.git C:\build\talk-desktop\spreed
          }
          # TALK_PATH setzen damit forge.config.js den Spreed-Pfad findet
          echo "TALK_PATH=C:\build\talk-desktop\spreed" >> $env:GITHUB_ENV
      - name: Cache node_modules (talk-desktop)
        uses: actions/cache@v4
        with:
          path: C:\build\talk-desktop\node_modules
          key: talk-desktop-node-${{ hashFiles('C:\build\talk-desktop\package-lock.json') }}-v1
          restore-keys: talk-desktop-node-

      - name: Cache node_modules (spreed)
        uses: actions/cache@v4
        with:
          path: C:\build\talk-desktop\spreed\node_modules
          key: talk-spreed-node-${{ hashFiles('C:\build\talk-desktop\spreed\package-lock.json') }}-v1
          restore-keys: talk-spreed-node-

      - name: Install WiX Toolset
        shell: pwsh
        run: |
          choco install wixtoolset -y --no-progress
          $wixBin = (Get-ChildItem "C:\Program Files (x86)\WiX Toolset*" -Directory |
            Sort-Object Name -Descending | Select-Object -First 1 -ExpandProperty FullName) + "\bin"
          $wixBin | Add-Content $env:GITHUB_PATH
          Write-Host "WiX: $wixBin"
      - name: Install dependencies
        shell: pwsh
        run: |
          Set-Location C:\build\talk-desktop
          npm ci
          npm ci --prefix=spreed
      - name: Build Talk Desktop ARM64
        shell: pwsh
        env:
          TALK_PATH: C:\build\talk-desktop\spreed
        run: |
          Set-Location C:\build\talk-desktop
          # Erst packen (erzeugt out\Nextcloud Talk-win32-arm64\)
          npm run build:windows:arm64
          # Dann Installer erstellen (exe + msi)
          npm run package:windows:arm64
          Write-Host "Build abgeschlossen"
      - name: Delete existing release assets
        shell: pwsh
        run: |
          $tag = "talk-$env:VERSION-arm64"
          $headers = @{ Authorization = "Bearer ${{ secrets.GITHUB_TOKEN }}"; "User-Agent" = "nextcloud-arm64-builder" }
          try { $release = Invoke-RestMethod "https://api.github.com/repos/${{ github.repository }}/releases/tags/$tag" -Headers $headers } catch { $release = $null }
          if ($release) {
            foreach ($asset in $release.assets) {
              Invoke-RestMethod "https://api.github.com/repos/${{ github.repository }}/releases/assets/$($asset.id)" -Method Delete -Headers $headers
              Write-Host "Gelöscht: $($asset.name)"
            }
          }
      - name: Find and copy artifacts
        shell: pwsh
        run: |
          Get-ChildItem "C:\build\talk-desktop\out" -Recurse -File |
            Where-Object { $_.Extension -in '.exe','.msi','.zip' } |
            ForEach-Object {
              $dest = "$env:GITHUB_WORKSPACE\$($_.Name)"
              Copy-Item $_.FullName $dest -Force
              Write-Host "Kopiert: $dest ($([math]::Round($_.Length/1MB,1)) MB)"
            }
      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: talk-${{ env.VERSION }}-arm64
          name: Nextcloud Talk ${{ env.VERSION }} ARM64 (inoffiziell)
          body: >-
            Nextcloud Talk Desktop ARM64 - Inoffizieller Build für Windows on ARM
            (Surface Pro X, Snapdragon X Elite, etc.).
            Gebaut aus dem offiziellen Nextcloud Talk Desktop Quellcode (main-Branch).
          files: |
            Nextcloud*arm64*.exe
            Nextcloud*arm64*.msi
            Nextcloud*arm64*.zip
          fail_on_unmatched_files: false